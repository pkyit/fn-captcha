server:
  port: 18080
  servlet:
    context-path: /fnCaptcha
spring:
  application:
    name: fn-captcha
  lifecycle:
    timeout-per-shutdown-phase: 5s

  data:
    redis:
      host: localhost
      port: 6379
      #      password: redis123456
      database: 0

# 验证码配置
pkyit:
  fncaptch:
    config:
      image-path: classpath:bg_images/
      image-count: 40
      encryption: false
      difficult: false
      expire-time: 120

